<!DOCTYPE html>
<html>
<head>
    <title>Digit Combinations</title>
</head>
<body>
    <h1>Generate Letter Combinations</h1>
    <form method="post">
        {% csrf_token %}
        <label for="digits">Enter 4 digits (2-9):</label>
        <input type="text" name="digits" id="digits" required>
        <button type="submit">Generate</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if combinations %}
        <h2>Possible Combinations:</h2>
        <ul>
            {% for combo in combinations %}
                <li>{{ combo }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
